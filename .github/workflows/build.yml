name: Build Bench Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Atualizar Arch
        run: |
          pacman -Syu --noconfirm

      - name: Instalar ferramentas do Arch
        run: |
          pacman -S --noconfirm \
            base-devel \
            git \
            wget \
            curl \
            ca-certificates \
            dpkg \
            fakeroot \
            binutils \
            squashfs-tools \
            xorriso \
            cpio \
            rsync \
            tar \
            gzip \
            xz \
            bzip2 \
            zstd \
            dosfstools \
            mtools \
            util-linux \
            file

      - name: Baixar live-build Debian
        run: |
          mkdir -p /tmp/live-build
          cd /tmp/live-build

          git clone --depth 1 \
            https://salsa.debian.org/live-team/live-build.git

          cd live-build

          make install

      - name: Instalar debootstrap
        run: |
          cd /tmp
          git clone --depth 1 \
            https://salsa.debian.org/installer-team/debootstrap.git

          cd debootstrap
          make install

      - name: Verificar ferramentas
        run: |
          lb --version
          debootstrap --version
          mksquashfs -version
          xorriso -version

      - name: Limpar build anterior
        run: |
          rm -rf .build
          rm -rf chroot
          rm -rf cache
          rm -rf binary
          rm -rf bootstrap
          rm -rf installer
          rm -rf source
          rm -rf tmp
          rm -rf auto
          rm -f *.iso

      - name: Configurar Debian Live
        run: |
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-chroot-security http://deb.debian.org/debian-security \
            --security false

      - name: Construir Bench Linux
        run: |
          lb build

      - name: Verificar ISO
        run: |
          echo "=== ISO GERADA ==="
          ls -lh *.iso
          file *.iso

      - name: Guardar ISO
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux-0.01
          path: "*.iso"
          if-no-files-found: error
