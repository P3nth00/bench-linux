name: Build Bench Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:bookworm

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          apt-get update
          apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            debian-archive-keyring \
            ca-certificates \
            git

      - name: Limpar build anterior
        run: |
          rm -rf .build
          rm -rf chroot
          rm -rf cache
          rm -rf binary
          rm -rf bootstrap
          rm -rf installer
          rm -rf source
          rm -rf tmp
          rm -f *.iso

      - name: Configurar Debian Live
        run: |
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-chroot-security http://deb.debian.org/debian-security

      - name: Construir ISO
        run: |
          lb build

      - name: Mostrar ISO
        run: |
          ls -lh *.iso

      - name: Guardar ISO
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux-0.01
          path: "*.iso"
