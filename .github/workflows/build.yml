name: Build Bench Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            debian-archive-keyring

      - name: Limpar configuração anterior
        run: |
          sudo rm -rf config
          sudo rm -rf .build
          sudo rm -rf chroot
          sudo rm -rf cache
          sudo rm -rf binary
          sudo rm -rf bootstrap
          sudo rm -rf installer
          sudo rm -rf source
          sudo rm -rf tmp
          sudo rm -f *.iso

      - name: Configurar Debian Live
        run: |
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-chroot-security http://deb.debian.org/debian-security
      - name: Construir ISO
        run: |
          sudo lb build

      - name: Mostrar ISO
        run: |
          ls -lh *.iso

      - name: Guardar ISO
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux-0.01
          path: "*.iso"
