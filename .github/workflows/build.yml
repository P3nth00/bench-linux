name: Build Bench Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Atualizar Arch
        run: |
          pacman -Syu --noconfirm

      - name: Instalar ferramentas
        run: |
          pacman -S --noconfirm \
            base-devel \
            git \
            wget \
            curl \
            ca-certificates \
            squashfs-tools \
            xorriso \
            cpio \
            rsync \
            tar \
            gzip \
            xz \
            bzip2 \
            zstd \
            dosfstools \
            mtools \
            util-linux \
            file \
            gawk \
            sed \
            grep \
            findutils

      - name: Instalar keyring Debian
        run: |
          mkdir -p /usr/share/keyrings

          wget -O /tmp/debian-archive-keyring.deb \
            http://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2023.3+deb12u2_all.deb

          bsdtar -xf /tmp/debian-archive-keyring.deb -C /tmp/debian-keyring

          cp /tmp/debian-keyring/usr/share/keyrings/debian-archive-keyring.gpg \
            /usr/share/keyrings/debian-archive-keyring.gpg

      - name: Baixar live-build
        run: |
          cd /tmp
          rm -rf live-build

          git clone --depth 1 \
            https://salsa.debian.org/live-team/live-build.git \
            live-build

      - name: Instalar live-build
        run: |
          cd /tmp/live-build

          mkdir -p /usr/share/live/build
          cp -r data functions /usr/share/live/build
          cp -r share/* /usr/share/live/build

          mkdir -p /usr/bin
          cp -a frontend/* /usr/bin

          mkdir -p /usr/lib/live
          cp -a scripts/* /usr/lib/live

          mkdir -p /usr/share/doc/live-build
          cp -r COPYING examples /usr/share/doc/live-build

          sed -e 's/.*(\(.*\)).*/\1/; q' \
            debian/changelog \
            > /usr/share/live/build/VERSION

      - name: Instalar debootstrap
        run: |
          cd /tmp
          rm -rf debootstrap

          git clone --depth 1 \
            https://salsa.debian.org/installer-team/debootstrap.git \
            debootstrap

          cd debootstrap
          make install

      - name: Verificar ferramentas
        run: |
          echo "=== live-build ==="
          lb --version

          echo "=== debootstrap ==="
          debootstrap --version

          echo "=== Debian keyring ==="
          ls -lh /usr/share/keyrings/debian-archive-keyring.gpg

          echo "=== squashfs ==="
          mksquashfs -version

          echo "=== xorriso ==="
          xorriso -version

      - name: Limpar build anterior
        run: |
          rm -rf .build
          rm -rf chroot
          rm -rf cache
          rm -rf binary
          rm -rf bootstrap
          rm -rf installer
          rm -rf source
          rm -rf tmp
          rm -rf auto
          rm -f *.iso

      - name: Configurar Debian Live
        run: |
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-chroot-security http://deb.debian.org/debian-security \
            --security false

      - name: Construir Bench Linux
        run: |
          lb build

      - name: Verificar ISO
        run: |
          echo "=============================="
          echo "       ISO GERADA"
          echo "=============================="

          ls -lh *.iso
          file *.iso

      - name: Guardar ISO
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux-0.01
          path: "*.iso"
          if-no-files-found: error
