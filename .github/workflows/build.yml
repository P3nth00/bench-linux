name: Build Bench Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            debian-archive-keyring \
            dosfstools \
            mtools

      - name: Verificar ambiente
        run: |
          lb --version
          debootstrap --version
          mksquashfs -version
          xorriso -version
          test -f /usr/share/keyrings/debian-archive-keyring.gpg

      - name: Limpar build anterior
        run: |
          sudo rm -rf chroot
          sudo rm -rf cache
          sudo rm -rf binary
          sudo rm -rf bootstrap
          sudo rm -rf installer
          sudo rm -rf source
          sudo rm -rf tmp
          sudo rm -rf .build
          sudo rm -f *.iso

      - name: Configurar Debian Live
        run: |
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --security false \
            --debian-installer false

      - name: Remover referência antiga de security
        run: |
          if [ -f config/archives/security.list.chroot ]; then
            rm -f config/archives/security.list.chroot
          fi

          mkdir -p config/archives

          cat > config/archives/no-security.list.chroot <<'EOF'
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian bookworm-updates main
          EOF

      - name: Construir ISO
        run: |
          sudo lb build

      - name: Verificar ISO
        run: |
          echo "===== BENCH LINUX ====="
          ls -lh *.iso
          file *.iso

      - name: Salvar ISO
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux-0.01
          path: "*.iso"
          if-no-files-found: error
