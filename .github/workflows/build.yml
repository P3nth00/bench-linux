name: Build BENCH Linux

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            debian-archive-keyring \
            dosfstools \
            mtools \
            isolinux \
            syslinux-common

      - name: Clean previous build
        run: |
          sudo rm -rf build
          sudo rm -rf chroot
          sudo rm -rf binary
          sudo rm -rf cache
          sudo rm -rf config/binary
          sudo rm -rf config/chroot
          sudo rm -rf config/bootstrap
          sudo rm -rf config/source
          sudo rm -rf config/archives
          sudo rm -f config/*.conf

      - name: Patch live-build Contents path
        run: |
          FILE="/usr/lib/live/build/lb_chroot_linux-image"

          sudo python3 - <<'PY'
          from pathlib import Path

          p = Path("/usr/lib/live/build/lb_chroot_linux-image")
          s = p.read_text()

          replacements = {
              '${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz':
              '${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz',

              '${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz':
              '${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz'
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)
          PY

          echo "=== Contents paths ==="
          grep -n "Contents-" "$FILE" || true

      - name: Configure live-build
        run: |
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --security false \
            --debian-installer false \
            --binary-images iso-hybrid

      - name: Build ISO
        run: |
          sudo lb build

      - name: List generated files
        if: always()
        run: |
          echo "=== Generated files ==="
          find . -maxdepth 3 -type f \
            \( -name "*.iso" -o -name "*.img" \) \
            -print

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux-iso
          path: "*.iso"
          if-no-files-found: error
